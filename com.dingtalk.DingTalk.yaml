id: com.dingtalk.DingTalk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
  - org.freedesktop.Sdk.Extension.rust-stable
command: dingtalk
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  # DingTalk only ships the xcb Qt platform plugin. The screenshare hook
  # uses XDG Desktop Portal/PipeWire while DingTalk itself runs on Xwayland.
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  # Notification
  - --talk-name=org.freedesktop.Notifications
  # System tray icon
  - --own-name=org.kde.*
  # File system
  - --filesystem=xdg-download
  - --filesystem=xdg-run/pipewire-0:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /libexec
  - /share/doc
  - /share/licenses
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: execstack
    buildsystem: simple
    build-commands:
      - bsdtar -xf execstack.rpm
      - install -Dpsm755 -t ${FLATPAK_DEST}/bin usr/bin/execstack
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://archives.fedoraproject.org/pub/archive/fedora/linux/releases/42/Everything/x86_64/os/Packages/e/execstack-0.5.0-30.fc42.x86_64.rpm
        sha256: e5f9ec5c5c7dffe90a93310e992878da5e7ac2474a46684d0b7edfdc93a80017
        dest-filename: execstack.rpm
      - type: file
        only-arches:
          - aarch64
        url: https://archives.fedoraproject.org/pub/archive/fedora/linux/releases/42/Everything/aarch64/os/Packages/e/execstack-0.5.0-30.fc42.aarch64.rpm
        sha256: 2f7eb87beeae911e36734960be3047878b39e349aab961bce282836a37418307
        dest-filename: execstack.rpm
  - name: libxcrypt
    buildsystem: autotools
    make-install-args:
      - PREFIX=/app
    sources:
      - type: git
        url: https://github.com/besser82/libxcrypt.git
        tag: v4.5.2
        commit: db70b42bd7b2a5b00a8580c8dec0aa66791c950a
        x-checker-data:
          type: git
          url: https://api.github.com/repos/besser82/libxcrypt/releases/latest
          tag-query: .tag_name
  - name: dingtalk-wayland-screenshare
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      env:
        CARGO_HOME: /run/build/dingtalk-wayland-screenshare/cargo
        CARGO_NET_OFFLINE: 'true'
        LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    build-commands:
      - cargo --offline --frozen build --release
      - install -Dpm755 target/release/libdingtalk_wayland_screenshare.so ${FLATPAK_DEST}/lib/libdingtalk_wayland_screenshare.so
    sources:
      - type: git
        url: https://github.com/cagedbird043/dingtalk-wayland-screenshare.git
        commit: 59a6b7caa98b035986624e7a4cdf2893464c63bb
      - cargo-sources.json
      - type: patch
        path: libspa-0.10.0-id-invalid.patch
  - name: dingtalk
    buildsystem: simple
    build-commands:
      - gcc -shared -fPIC -Wl,--version-script=ssl_peer_certificate_shim.map -o libdingtalk_ssl_peer_certificate_shim.so
        ssl_peer_certificate_shim.c
      - install -Dpm755 libdingtalk_ssl_peer_certificate_shim.so -t ${FLATPAK_DEST}/lib
      - install -Dpm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - install -Dpm755 dingtalk.sh $FLATPAK_DEST/bin/dingtalk
      - install -Dpm644 com.dingtalk.DingTalk.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dpm644 com.dingtalk.DingTalk.png -t ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps
      - install -Dpm644 com.dingtalk.DingTalk.desktop -t ${FLATPAK_DEST}/share/applications
    sources:
      - type: script
        commands:
          - bsdtar -O -xf dingtalk.deb data.* | bsdtar --no-same-owner -xf -
          - mkdir -p dingtalk/release
          - mv opt/apps/com.alibabainc.dingtalk/files/*-Release.*/* dingtalk/release
          - mv opt/apps/com.alibabainc.dingtalk/files/version dingtalk
          - rm -rf dingtalk/release/libgtk-x11-2.0.so.*
          - rm -rf dingtalk/release/{libm.so.6,libstdc*,libharfbuzz*,libgbm*,libcurl.so.4,libz*,libGL*}
          - rm -rf dingtalk/release/Resources/{i18n/tool/*.exe,qss/mac,web_content/NativeWebContent_*.zip}
          - rm -rf dingtalk.deb usr opt
          - execstack -c dingtalk/release/{dingtalk_dll,libconference_new}.so
        dest-filename: apply_extra

      - type: file
        path: dingtalk.sh

      - type: file
        path: ssl_peer_certificate_shim.c

      - type: inline
        dest-filename: ssl_peer_certificate_shim.map
        contents: |
          OPENSSL_1_1_0 {
            global: SSL_get_peer_certificate;
          };

      - type: file
        path: com.dingtalk.DingTalk.metainfo.xml

      - type: file
        path: com.dingtalk.DingTalk.png

      - type: file
        path: com.dingtalk.DingTalk.desktop

      - type: extra-data
        filename: dingtalk.deb
        only-arches: [x86_64]
        url: https://dtapp-pub.dingtalk.com/dingtalk-desktop/xc_dingtalk_update/linux_deb/Release/com.alibabainc.dingtalk_8.2.8.260818002_amd64.deb
        sha256: 88dad607bbb7a72918399391c9d53aedfcfa3a6dab01f7d0659e62c1ca32678f
        size: 374323140
        x-checker-data:
          type: rotating-url
          url: https://www.dingtalk.com/win/d/qd=linux_amd64
          pattern: https://dtapp-pub.dingtalk.com/dingtalk-desktop/xc_dingtalk_update/linux_deb/Release/com.alibabainc.dingtalk_([0-9.]+)_amd64.deb

      - type: extra-data
        filename: dingtalk.deb
        only-arches: [aarch64]
        url: https://dtapp-pub.dingtalk.com/dingtalk-desktop/xc_dingtalk_update/linux_deb/Release/com.alibabainc.dingtalk_8.2.8.260818002_arm64.deb
        sha256: 22269eaadaa5e7dab6a24c1c37baf2c45a572221a3839a9ff4a487079812dabc
        size: 375304932
        x-checker-data:
          type: rotating-url
          url: https://www.dingtalk.com/win/d/qd=linux_arm64
          pattern: https://dtapp-pub.dingtalk.com/dingtalk-desktop/xc_dingtalk_update/linux_deb/Release/com.alibabainc.dingtalk_([0-9.]+)_arm64.deb
